[dependency-groups]
dev = [
  # Test runner, plugins, and retained execution evidence
  "allure-pytest>=2.16,<3",
  # Security auditing
  "bandit>=1.9.4",
  "check-manifest>=0.51",
  "check-wheel-contents>=0.6.1",
  "commitizen>=4.16.3",
  # Project hygiene
  "deptry>=0.25.1",
  "flake8>=7.3",
  "flake8-class-attributes-order>=0.3",
  "flake8-cognitive-complexity>=0.1",
  "hypothesis>=6.155.3",
  "import-linter>=2.11",
  # Docs consistency
  "interrogate>=1.7",
  # Interactive development
  "ipykernel>=7.3.0",
  "ipytest>=0.14.2,<0.15",
  "ipython>=9.14.1",
  "mdformat>=0.7.22",
  "mdformat-beautysh>=1.0.0",
  "mdformat-frontmatter>=2.1.2",
  "mdformat-gfm>=1.0.0",
  "mdformat-ruff>=0.1.3",
  "mdformat-tables>=1.0.0",
  "nest-asyncio>=1.6",
  "pillow>=12.2",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.0",
[[% if package_name != "py_lib_policy" %]]
  # Shared repo tooling and test support
  "py-lib-policy",
[[% endif %]]
[[% if package_name not in ["py_lib_policy", "py_lib_runtime", "py_lib_testkit"] %]]
  "py-lib-testkit",
[[% endif %]]
  "pyproject-fmt>=2.23.0",
  "pyright>=1.1.410",
  "pytest>=9.1.0",
  "pytest-bdd>=8.1,<9",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "pytest-recording>=0.13.4",
  "pytest-xdist>=3.8.0",
  # Code quality and formatting
  "radon>=6.0.1",
  "rich>=15",
  "ruff>=0.15.17",
  "syrupy>=5.3.2",
  "twine>=6.2.0",
  "ty>=0.0.50",
  "types-pillow>=10.2.0.20240822",
  "validate-pyproject>=0.25",
]
docs = [
  "matplotlib>=3.11.1",
[[% if package_name != "ternforge_docops" %]]
  "ternforge-docops>=0.4.2,<0.5",
[[% endif %]]
]

