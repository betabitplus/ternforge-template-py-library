name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@5ae3d760d3daae67c97d058e73c203d5acf6f4b9 # v1.6.0
    with:
      python-version: "3.13"
      policy-command: "[[[ ci_policy_command ]]]"
      runtime-audit-exclude-package: "[[[ runtime_audit_exclude_package ]]]"
