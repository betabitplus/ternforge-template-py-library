name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    name: ci / required
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create read-only source App token
        id: source-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TERNFORGE_SOURCE_READ_CLIENT_ID }}
          private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Configure Git authentication for private sources
        env:
          GH_TOKEN: ${{ steps.source-read-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version-file: template/_components/components/quality/py/includes/uv/pyproject.toml
          enable-cache: false

      - name: Set up exact Vendir
        uses: carvel-dev/setup-action@efbf2625e8469080d87175c02690634d4b0ad476 # v2.2.0
        with:
          token: ${{ github.token }}
          only: vendir
          vendir: 0.46.0

      - name: Verify declared component snapshot
        env:
          GH_TOKEN: ${{ steps.source-read-token.outputs.token }}
        run: |
          set -euo pipefail
          vendir sync
          git diff --exit-code -- vendir.lock.yml template/_components

      - name: Verify complete generated Python product
        env:
          GH_TOKEN: ${{ steps.source-read-token.outputs.token }}
          TEMPLATE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          TEMPLATE_URL: https://github.com/${{ github.repository }}.git
        run: scripts/accept-template.sh

      - name: Verify repository files
        run: |
          set -euo pipefail
          git diff --check
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
