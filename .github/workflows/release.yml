name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-slim' }}
    timeout-minutes: 15
    environment: release
    steps:
      - name: Run release automation
        uses: betabitplus/ternforge-infra-ci/.github/actions/release@fc575846a451e7f4a6594d81c1dc4eece7fe9596 # v5.1.2
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
