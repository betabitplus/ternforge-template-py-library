name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-slim' }}
    timeout-minutes: 15
    environment: release
    steps:
      - name: Run release automation
        uses: betabitplus/ternforge-infra-ci/.github/actions/release@c0f16c20f747e9bfa00c32ba5e42246d2e986c52 # v5.1.0
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
