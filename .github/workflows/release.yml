name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-slim' }}
    timeout-minutes: 15
    environment: release
    steps:
      - name: Run release automation
        uses: betabitplus/ternforge-infra-ci/.github/actions/release@5ded5e840dde00fe319e2decef1774a9255a9d08 # v5.3.0
        with:
          app-client-id: ${{ vars.TERNFORGE_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.TERNFORGE_RELEASE_PRIVATE_KEY }}
